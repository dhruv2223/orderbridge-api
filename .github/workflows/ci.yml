name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Integration tests start Postgres with Testcontainers (Docker is available on GitHub runners)
      - name: Build and test
        run: ./mvnw -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Build failure"
            echo '```'
            grep -E '\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|Caused by' build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[ERROR\]|Caused by' build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=Maven build failed::/'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      - name: Build Docker image
        run: docker build -t orderbridge-api .
