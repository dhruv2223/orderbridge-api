name: orderbridge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderbridge
      POSTGRES_USER: orderbridge
      POSTGRES_PASSWORD: orderbridge
    ports:
      - "5432" # random host port; Spring Boot discovers it, avoiding clashes with a local Postgres

  # Not started by `mvn spring-boot:run`; run the full stack with `docker compose --profile app up --build`
  app:
    profiles: [ app ]
    build: .
    depends_on: [ postgres ]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderbridge
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"
