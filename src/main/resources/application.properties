spring.application.name=orderbridge-api

# Postgres is started from compose.yaml by spring-boot-docker-compose during local development.
# In production these are overridden with SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/orderbridge
spring.datasource.username=orderbridge
spring.datasource.password=orderbridge

# Keep RFC 9457 problem details on for errors Spring raises itself
spring.mvc.problemdetails.enabled=true

# Allow ?format=json|xml in addition to the Accept header (handy in a browser)
spring.mvc.contentnegotiation.favor-parameter=true

# Omit null fields in both JSON and XML instead of rendering "null" / xsi:nil
spring.jackson.default-property-inclusion=non_null

# External exchange-rate API (free, no key) used by the declarative HTTP client
orderbridge.fx.base-url=https://api.frankfurter.dev/v1

# Demo users (bcrypt hashing happens at startup). Override via env vars in any real deployment.
orderbridge.security.admin-password=${ORDERBRIDGE_ADMIN_PASSWORD:admin-secret}
orderbridge.security.partner-password=${ORDERBRIDGE_PARTNER_PASSWORD:partner-secret}

management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.description=B2B order management REST API (JSON + XML)

springdoc.swagger-ui.path=/swagger-ui.html
